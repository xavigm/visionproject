<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Panel de Detección en Tiempo Real - RF-DETR</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-dark text-light">
    <div class="container my-4">
        <h2 class="mb-4 text-center">Dashboard de Análisis de Visión (GPU RTX 3060)</h2>

        <!-- Panel de Control e Input -->
        <div class="card bg-secondary text-white mb-4">
            <div class="card-body">
                <div class="row g-3">
                    <div class="col-md-8">
                        <input type="text" id="streamSource" class="form-control" placeholder="Ruta de vídeo/imagen, URL RTSP o '0' para Webcam">
                    </div>
                    <div class="col-md-2">
                        <button onclick="startStream()" class="btn btn-success w-100">Iniciar Stream</button>
                    </div>
                    <div class="col-md-2">
                        <button onclick="stopStream()" class="btn btn-danger w-100">Detener</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="row mb-4">
            <!-- Reproductor de Video -->
            <div class="col-lg-8">
                <div class="card bg-secondary text-center p-2">
                    <img id="videoFeed" src="/video_feed" class="img-fluid rounded" alt="Sin flujo de video activo">
                </div>
            </div>

            <!-- Métricas Actuales en Tiempo Real -->
            <div class="col-lg-4">
                <div class="card bg-secondary text-white h-100">
                    <div class="card-header fw-bold">Conteo Actual</div>
                    <div class="card-body d-flex flex-column justify-content-around">
                        <div class="p-3 bg-dark rounded">
                            <h5>Personas: <span id="countPersons" class="badge bg-primary fs-4">0</span></h5>
                        </div>
                        <div class="p-3 bg-dark rounded">
                            <h5>Vehículos: <span id="countVehicles" class="badge bg-warning text-dark fs-4">0</span></h5>
                        </div>
                        <div class="p-3 bg-dark rounded">
                            <h5>Animales: <span id="countAnimals" class="badge bg-info text-dark fs-4">0</span></h5>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Gráfica Histórica -->
        <div class="card bg-secondary text-white">
            <div class="card-header fw-bold">Detecciones Promedio por Minuto (Última Hora)</div>
            <div class="card-body">
                <canvas id="metricsChart" height="100"></canvas>
            </div>
        </div>
    </div>

    <script>
        // Inicialización de Chart.js
        const ctx = document.getElementById('metricsChart').getContext('2d');
        const metricsChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: [],
                datasets: [
                    { label: 'Personas', data: [], borderColor: '#0d6efd', tension: 0.3, fill: false },
                    { label: 'Vehículos', data: [], borderColor: '#ffc107', tension: 0.3, fill: false },
                    { label: 'Animales', data: [], borderColor: '#0dcaf0', tension: 0.3, fill: false }
                ]
            },
            options: {
                responsive: true,
                scales: {
                    x: { ticks: { color: '#ffffff' } },
                    y: { ticks: { color: '#ffffff' }, beginAtZero: true }
                },
                plugins: { legend: { labels: { color: '#ffffff' } } }
            }
        });

        function startStream() {
            const source = document.getElementById('streamSource').value;
            fetch('/api/start', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ source: source })
            });
        }

        function stopStream() {
            fetch('/api/stop', { method: 'POST' });
        }

        // Bucle de actualización cada 2 segundos
        setInterval(() => {
            fetch('/api/metrics')
                .then(res => res.json())
                .then(data => {
                    // Actualizar contadores numéricos
                    document.getElementById('countPersons').innerText = data.current.persons;
                    document.getElementById('countVehicles').innerText = data.current.vehicles;
                    document.getElementById('countAnimals').innerText = data.current.animals;

                    // Actualizar gráfico
                    metricsChart.data.labels = data.history.labels;
                    metricsChart.data.datasets[0].data = data.history.persons;
                    metricsChart.data.datasets[1].data = data.history.vehicles;
                    metricsChart.data.datasets[2].data = data.history.animals;
                    metricsChart.update();
                });
        }, 2000);
    </script>
</body>
</html>
